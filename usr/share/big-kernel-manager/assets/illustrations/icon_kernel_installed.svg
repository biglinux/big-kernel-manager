<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Outer glow ring -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#26a269" stroke-width="1" opacity="0.15"/>
  <!-- Background circle -->
  <circle cx="24" cy="24" r="18" fill="#26a269" opacity="0.08"/>
  <!-- Hard drive body -->
  <rect x="12" y="16" width="24" height="16" rx="3" ry="3"
        fill="#26a269" opacity="0.18" stroke="#26a269" stroke-width="1.2"/>
  <!-- Drive platter line -->
  <line x1="14" y1="27" x2="34" y2="27" stroke="#26a269" stroke-width="0.8" opacity="0.4"/>
  <!-- Drive indicator light -->
  <circle cx="31" cy="30" r="1.5" fill="#33d17a" opacity="0.6"/>
  <!-- Checkmark overlay -->
  <polyline points="19,23 22,26 29,19" fill="none" stroke="#26a269" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Accent dot -->
  <circle cx="13" cy="35" r="2.5" fill="#26a269" opacity="0.35"/>
  <circle cx="13" cy="35" r="1" fill="#33d17a" opacity="0.7"/>
</svg>
